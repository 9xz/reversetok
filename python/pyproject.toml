[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reversetok"
version = "0.1.0"
description = "Pure-Python TikTok request signing, TTEncrypt, device registration, and signup"
requires-python = ">=3.10"

dependencies = ["wreq>=0.13.0"]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "cryptography>=44",
    "httpx>=0.28",
]

[project.scripts]
reversetok-api = "reversetok.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reversetok*"]

[tool.setuptools.package-data]
reversetok = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
