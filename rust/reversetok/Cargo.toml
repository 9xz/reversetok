[package]
name = "reversetok"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "TikTok request signing with wreq integration"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
hex = "0.4"
flate2 = "1"
http = "1"
md-5 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
wreq = { version = "6.0.0-rc.31", default-features = false, features = ["tokio-rt", "webpki-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-util"] }
